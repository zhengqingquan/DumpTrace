[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dumptrace"
version = "0.1.0"
description = "Analyze Unisoc/UIS armlog crash dumps and export crash scenes"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DumpTrace" }]

[project.scripts]
dumptrace = "dumptrace.cli:main"

[tool.setuptools.packages.find]
include = ["dumptrace*"]
