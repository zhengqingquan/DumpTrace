# DumpTrace 配置示例（复制为 dumptrace.toml 后按需修改）

[tools]
# addr2line = "D:/path/to/addr2line.exe"

[export]
copy_ass = false
bundle = false
full = false
strict_symbols = false

[credibility]
warn_lost_pct = 5.0
bad_lost_pct = 15.0

[timeline]
enable = true
windows_sec = [3, 10, 60]
keywords = ["camera", "preview", "encode", "stream", "assert", "abort", "T_P_APP", "IMG_", "display"]

[mem]
enable = true
base = "0x80000000"
code_ranges = ["0x60000000-0x62000000"]
window_bytes = 256

[sideband]
# Fat / NV / iram（无段则 skip）
enable = true

[rtos]
queue_pressure_pct = 80.0
stack_overflow_pct = 90.0

# 定时器名子串 → 模块归类（可扩展；默认已内置 display/camera/audio/network/usb/power/system）
# [timer_modules]
# display = ["MMK", "LCD", "period", "GIF", "UI"]
# network = ["ATC", "SIP", "NET", "MNPS"]

# 时间线模块聚类词典（可扩展）
# [timeline_modules]
# camera = ["camera", "preview", "isp"]
# display = ["display", "lcd", "mmi"]
